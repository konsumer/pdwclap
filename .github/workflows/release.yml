name: Release

# One zip per platform, each holding the built external plus the help patch
# and the example plugins (see ci/package.sh). They are attached to the
# published release; a manual run builds the same zips as workflow artifacts
# so the packaging can be exercised without cutting a release, and attaches
# them to a release when a tag is given.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the zips to
        required: false
        default: ""

permissions:
  contents: read

env:
  # Tag name for a release, the optional dispatch tag otherwise — empty in a
  # plain dispatch, which ci/package.sh falls back to the commit hash for.
  VERSION: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --parallel
      # The archive is advertised as universal, so check it really is: the
      # per-architecture Wasmtime libs get lipo'd together regardless, and a
      # missing -DCMAKE_OSX_ARCHITECTURES would still build (native only).
      - name: Check the external is universal
        run: |
          lipo -info "wclap~.pd_darwin"
          lipo -info "wclap~.pd_darwin" | grep -q "x86_64 arm64"
      - name: Package
        run: bash ci/package.sh macos-universal "wclap~.pd_darwin"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build
          cmake --build build --parallel
      - name: Package
        run: bash ci/package.sh "linux-${{ matrix.arch }}" "wclap~.pd_linux"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release --parallel
      - name: Package
        shell: bash
        # No vcvars needed for the Visual Studio generator, but it is a
        # multi-config one, so the external lands in a per-config directory —
        # find it rather than assume which. wasmtime.dll is copied next to it
        # by CMakeLists.txt and Pd needs it there.
        run: |
          dll=$(find . -name 'wclap~.dll' -not -path './build/_deps/*' -print -quit)
          bash ci/package.sh windows-x86_64 "$dll" "$(dirname "$dll")/wasmtime.dll"
      - name: Smoke-test the packaged external
        shell: pwsh
        # Runs what actually ships: the zip, unzipped, under a Pd from the
        # same distribution the build took its import library from. The patch
        # loads an example plugin and asks it for its params — which only
        # comes back if the external and wasmtime.dll both loaded — then
        # quits by itself.
        run: |
          $pd = (Get-ChildItem build/pd-windows -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Expand-Archive -Path dist/*.zip -DestinationPath smoke
          Set-Content -Path smoke/smoke.pd -Value @(
            '#N canvas 0 0 450 300 12;',
            '#X obj 25 25 wclap~;',
            '#X msg 25 90 load examples/juno1.wclap.wasm;',
            '#X obj 25 170 print wclap;',
            '#X obj 25 60 loadbang;',
            '#X obj 180 60 delay 2500;',
            '#X msg 25 130 params;',
            '#X obj 320 60 delay 5000;',
            '#X msg 320 130 \; pd quit;',
            '#X connect 3 0 1 0;',
            '#X connect 3 0 4 0;',
            '#X connect 3 0 6 0;',
            '#X connect 4 0 5 0;',
            '#X connect 5 0 0 0;',
            '#X connect 6 0 7 0;',
            '#X connect 1 0 0 0;',
            '#X connect 0 2 2 0;'
          )
          $p = Start-Process -FilePath "$pd\bin\pd.com" -WorkingDirectory "$PWD\smoke" `
            -ArgumentList '-nogui', '-noaudio', '-stderr', '-open', 'smoke.pd' `
            -RedirectStandardOutput "$PWD\smoke\out.log" -RedirectStandardError "$PWD\smoke\err.log" -PassThru
          $p | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force; throw "Pd did not quit on its own" }
          Get-Content "$PWD\smoke\out.log", "$PWD\smoke\err.log"
          if (-not (Select-String -Path "$PWD\smoke\out.log", "$PWD\smoke\err.log" -Pattern 'paraminfo 0 ' -Quiet)) {
            throw "the packaged external did not load its plugin in Pd"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Attach zips to release
    needs: [macos, linux, windows]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
        # No checkout in this job, so gh has no remote to infer the repo from.
        run: gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
